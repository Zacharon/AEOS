<svg id="architecture-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1060" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">AEOS public preview component architecture</title>
<desc id="arch-desc">The operator reads a router and project records, fills a packet, builds and checks a bounded context bundle, and manually hands it to an assistant. Result checks are followed by independent review when required, applicable owner gates and manual project writeback. A separate Librarian path ingests source bytes into Bronze, proposes and verifies Silver, requires an exact owner decision and covered Git checkpoint, then applies Gold. Invalid or stale evidence stops work. Solid connectors are CLI or file operations; dashed connectors are manual actions.</desc>
<defs><marker id="arch-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#234d9b"/></marker><marker id="arch-manual-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#53677a"/></marker><style>.a-title{font:600 30px 'Segoe UI',Arial,sans-serif;fill:#172c42}.a-sub{font:17px 'Segoe UI',Arial,sans-serif;fill:#53677a}.a-kicker{font:12px Consolas,'Courier New',monospace;letter-spacing:1px;fill:#234d9b}.a-label{font:600 19px 'Segoe UI',Arial,sans-serif;fill:#172c42}.a-body{font:16px 'Segoe UI',Arial,sans-serif;fill:#53677a}.a-status{font:11px Consolas,'Courier New',monospace;letter-spacing:.5px;fill:#234d9b}.a-status-manual{fill:#53677a}.a-note{font:14px 'Segoe UI',Arial,sans-serif;fill:#53677a}.a-box{fill:#fff;stroke:#cbd5df;stroke-width:1.5}.a-cli{fill:#e6eefb;stroke:#234d9b;stroke-width:1.5}.a-gate{fill:#fff5df;stroke:#9a742d;stroke-width:1.5}.a-solid{fill:none;stroke:#234d9b;stroke-width:2;marker-end:url(#arch-arrow)}.a-manual{fill:none;stroke:#53677a;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arch-manual-arrow)}</style></defs>
<rect width="1400" height="1060" fill="#fff"/>
<text x="40" y="50" class="a-title">AEOS: from saved facts to verified work</text><text x="40" y="82" class="a-sub">Public.2 · 2026-10-09 · CLI operations and manual handoffs are different responsibilities.</text>
<rect x="24" y="116" width="1352" height="464" rx="8" fill="#f4f7fa"/><text x="40" y="151" class="a-kicker">PROJECT WORK / BOUNDED CONTEXT + RETURNED EVIDENCE</text>
<g transform="translate(40 205)"><rect class="a-box" width="200" height="142" rx="6"/><text class="a-status a-status-manual" x="16" y="25">MANUAL</text><text class="a-label" x="16" y="54">Route the task</text><text class="a-body" x="16" y="81">Read AGENTS / router</text><text class="a-body" x="16" y="106">Read project records</text><text class="a-body" x="16" y="130">Queue if choosing work</text></g>
<g transform="translate(300 205)"><rect class="a-box" width="200" height="142" rx="6"/><text class="a-status" x="16" y="25">CLI + MANUAL</text><text class="a-label" x="16" y="54">Bound the task</text><text class="a-body" x="16" y="81">Scaffold packet</text><text class="a-body" x="16" y="106">Fill scope + checks</text><text class="a-body" x="16" y="130">Record authorization</text></g>
<g transform="translate(560 205)"><rect class="a-cli" width="200" height="142" rx="6"/><text class="a-status" x="16" y="25">IMPLEMENTED CLI</text><text class="a-label" x="16" y="54">Build + check</text><text class="a-body" x="16" y="81">Brief + file snapshots</text><text class="a-body" x="16" y="106">Manifest + hashes</text><text class="a-body" x="16" y="130">Freshness + integrity</text></g>
<g transform="translate(820 205)"><rect class="a-box" width="200" height="142" rx="6"/><text class="a-status a-status-manual" x="16" y="25">MANUAL TRANSPORT</text><text class="a-label" x="16" y="54">Assistant + tools</text><text class="a-body" x="16" y="81">Give selected files</text><text class="a-body" x="16" y="106">Do authorized work</text><text class="a-body" x="16" y="130">Return result + artifacts</text></g>
<g transform="translate(1080 205)"><rect class="a-cli" width="280" height="142" rx="6"/><text class="a-status" x="16" y="25">IMPLEMENTED CLI</text><text class="a-label" x="16" y="54">Validate + review</text><text class="a-body" x="16" y="81">Result / artifact identities</text><text class="a-body" x="16" y="106">Check current source bytes</text><text class="a-body" x="16" y="130">Complete: changes + rationale</text></g>
<path class="a-manual" d="M240 274H300"/><path class="a-solid" d="M500 274H560"/><path class="a-manual" d="M760 274H820"/><path class="a-manual" d="M1020 274H1080"/>
<text x="252" y="258" class="a-note">read</text><text x="511" y="258" class="a-note">packet</text><text x="768" y="258" class="a-note">give</text><text x="1028" y="258" class="a-note">return</text>
<g transform="translate(40 402)"><rect class="a-box" width="370" height="124" rx="6"/><text class="a-status a-status-manual" x="16" y="25">MANUAL SELECTION</text><text class="a-label" x="16" y="54">Explicit context file list</text><text class="a-body" x="16" y="82">Relevant project facts + cited knowledge</text><text class="a-body" x="16" y="108">Source records stay in canonical storage</text></g>
<path class="a-manual" d="M410 464H535V324H560"/><text x="425" y="449" class="a-note">selected files</text>
<g transform="translate(560 402)"><rect class="a-gate" width="460" height="124" rx="6"/><text class="a-status a-status-manual" x="16" y="25">MANUAL / FAILURE PATH</text><text class="a-label" x="16" y="54">Stop, inspect, revise</text><text class="a-body" x="16" y="82">Invalid / stale / missing evidence: no promotion</text><text class="a-body" x="16" y="108">Preserve receipts; rebuild the authorized bundle</text></g>
<g transform="translate(1080 402)"><rect class="a-gate" width="280" height="124" rx="6"/><text class="a-status a-status-manual" x="16" y="25">MANUAL / AUTHORITY GATE</text><text class="a-label" x="16" y="54">Review + writeback</text><text class="a-body" x="16" y="82">Independent review when required</text><text class="a-body" x="16" y="108">Owner gates; controller writes</text></g>
<path class="a-manual" d="M660 347V402"/><text x="672" y="379" class="a-note">check refuses</text><path class="a-manual" d="M1220 347V402"/><text x="1232" y="380" class="a-note">candidate only</text><path class="a-manual" d="M1160 347V377H1010V402"/><text x="868" y="379" class="a-note">failed check</text>
<rect x="24" y="604" width="1352" height="245" rx="8" fill="#f0f5f2"/><text x="40" y="639" class="a-kicker">KNOWLEDGE PROMOTION / A SEPARATE GATE</text>
<g transform="translate(40 675)"><rect class="a-box" width="200" height="142" rx="6"/><text class="a-status a-status-manual" x="16" y="25">MANUAL</text><text class="a-label" x="16" y="54">Selected source</text><text class="a-body" x="16" y="81">File + origin metadata</text><text class="a-body" x="16" y="106">Candidate is authored</text><text class="a-body" x="16" y="130">by human / assistant</text></g>
<g transform="translate(300 675)"><rect class="a-cli" width="200" height="142" rx="6"/><text class="a-status" x="16" y="25">IMPLEMENTED CLI</text><text class="a-label" x="16" y="54">Ingest → Bronze</text><text class="a-body" x="16" y="81">Preserved source bytes</text><text class="a-body" x="16" y="106">Provenance registry</text><text class="a-body" x="16" y="130">No generated summaries</text></g>
<g transform="translate(560 675)"><rect class="a-cli" width="200" height="142" rx="6"/><text class="a-status" x="16" y="25">IMPLEMENTED CLI</text><text class="a-label" x="16" y="54">Propose + verify</text><text class="a-body" x="16" y="81">Candidate + source</text><text class="a-body" x="16" y="106">Payload + full diff</text><text class="a-body" x="16" y="130">Pending ≠ approved</text></g>
<g transform="translate(820 675)"><rect class="a-gate" width="200" height="142" rx="6"/><text class="a-status a-status-manual" x="16" y="25">MANUAL / OWNER GATE</text><text class="a-label" x="16" y="54">Exact decision</text><text class="a-body" x="16" y="81">Owner approves content</text><text class="a-body" x="16" y="106">Covered Git checkpoint</text><text class="a-body" x="16" y="130">No inferred approval</text></g>
<g transform="translate(1080 675)"><rect class="a-cli" width="280" height="142" rx="6"/><text class="a-status" x="16" y="25">IMPLEMENTED CLI / GATED</text><text class="a-label" x="16" y="54">Apply → Gold</text><text class="a-body" x="16" y="81">Dry-run; fresh evidence checks</text><text class="a-body" x="16" y="106">Authorized target update + receipt</text><text class="a-body" x="16" y="130">Doctor / validated rollback available</text></g>
<path class="a-solid" d="M240 742H300"/><path class="a-solid" d="M500 742H560"/><path class="a-manual" d="M760 742H820"/><path class="a-solid" d="M1020 742H1080"/>
<text x="252" y="725" class="a-note">ingest</text><text x="511" y="725" class="a-note">source</text><text x="772" y="725" class="a-note">review</text><text x="1030" y="725" class="a-note">apply</text>
<path class="a-manual" d="M920 675V569H790V526"/><text x="795" y="558" class="a-note">pending / revise / reject: no Gold write</text>
<path class="a-manual" d="M1340 526V873H1320V915"/><text x="1062" y="875" class="a-note">authorized project facts + next action</text>
<path class="a-solid" d="M1220 817V915"/><text x="1025" y="900" class="a-note">approved knowledge</text>
<g transform="translate(40 915)"><rect width="1320" height="103" rx="6" fill="#172c42"/><text x="20" y="32" style="font:12px Consolas,'Courier New',monospace;fill:#bcd1f5;letter-spacing:1px">CANONICAL FILE STORAGE / NO BACKGROUND SERVICE</text><text x="20" y="64" style="font:600 22px 'Segoe UI',Arial,sans-serif;fill:#fff">Project Index · State · Next Actions + source-backed Gold notes</text><text x="20" y="88" style="font:16px 'Segoe UI',Arial,sans-serif;fill:#d7e1eb">Next session reads these saved records. Generated handoff snapshots remain separate from authoritative state.</text></g>
<path class="a-manual" d="M40 950H12V464H40"/>
<text x="40" y="1043" class="a-note">ICM and LLM Wiki inform context and knowledge design. No automatic Wiki, model dispatch or authenticated approval service is installed.</text>
</svg>
