<svg id="workflow-diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 830" role="img" aria-labelledby="work-title work-desc">
<title id="work-title">AEOS five-stage usage and responsibility flow</title><desc id="work-desc">The operator plans a scoped task, local commands retrieve selected context and check a bundle, the assistant executes through manual transport, commands plus reviewers verify results, and the controller saves authorized facts. A failed check returns to inspection and a new authorized bundle. Learned knowledge is only promoted by a separate Librarian owner-gated apply. A fresh session reads the saved result and next action.</desc>
<defs><marker id="work-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#234d9b"/></marker><marker id="work-manual-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#53677a"/></marker><style>.w-title{font:600 30px 'Segoe UI',Arial,sans-serif;fill:#172c42}.w-sub{font:17px 'Segoe UI',Arial,sans-serif;fill:#53677a}.w-head{font:600 25px 'Segoe UI',Arial,sans-serif;fill:#172c42}.w-role{font:11px Consolas,'Courier New',monospace;letter-spacing:.5px;fill:#234d9b}.w-text{font:17px 'Segoe UI',Arial,sans-serif;fill:#53677a}.w-label{font:600 16px 'Segoe UI',Arial,sans-serif;fill:#172c42}.w-small{font:14px 'Segoe UI',Arial,sans-serif;fill:#53677a}.w-solid{fill:none;stroke:#234d9b;stroke-width:2;marker-end:url(#work-arrow)}.w-manual{fill:none;stroke:#53677a;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#work-manual-arrow)}</style></defs>
<rect width="1400" height="830" fill="#fff"/><text x="40" y="50" class="w-title">One task, five stages, visible responsibility</text><text x="40" y="82" class="w-sub">Public.2 · 2026-10-09 · The operator invokes the tools; assistant transport remains manual.</text>
<g transform="translate(40 150)"><rect width="232" height="306" rx="6" fill="#f4f7fa" stroke="#cbd5df"/><text x="18" y="30" class="w-role">01 / OPERATOR + ASSISTANT</text><text x="18" y="72" class="w-head">Plan</text><text x="18" y="106" class="w-text">Read project truth.</text><text x="18" y="134" class="w-text">Choose one task.</text><text x="18" y="162" class="w-text">Define permitted work</text><text x="18" y="190" class="w-text">and acceptance checks.</text><path d="M18 215H214" stroke="#cbd5df"/><text x="18" y="246" class="w-label">Output: scoped packet</text><text x="18" y="277" class="w-role">MANUAL + PACKET CLI</text></g>
<g transform="translate(312 150)"><rect width="232" height="306" rx="6" fill="#e6eefb" stroke="#234d9b"/><text x="18" y="30" class="w-role">02 / OPERATOR + LOCAL CLI</text><text x="18" y="72" class="w-head">Retrieve</text><text x="18" y="106" class="w-text">Select relevant files.</text><text x="18" y="134" class="w-text">Build bounded context.</text><text x="18" y="162" class="w-text">Check source hashes</text><text x="18" y="190" class="w-text">before giving the bundle.</text><path d="M18 215H214" stroke="#b6c7e2"/><text x="18" y="246" class="w-label">Output: checked bundle</text><text x="18" y="277" class="w-role">MANUAL SELECTION + CLI</text></g>
<g transform="translate(584 150)"><rect width="232" height="306" rx="6" fill="#f4f7fa" stroke="#cbd5df"/><text x="18" y="30" class="w-role">03 / ASSISTANT + TOOLS</text><text x="18" y="72" class="w-head">Execute</text><text x="18" y="106" class="w-text">Receive selected files.</text><text x="18" y="134" class="w-text">Use authorized tools.</text><text x="18" y="162" class="w-text">Capture real changes,</text><text x="18" y="190" class="w-text">artifacts and checks.</text><path d="M18 215H214" stroke="#cbd5df"/><text x="18" y="246" class="w-label">Output: result + evidence</text><text x="18" y="277" class="w-role">MANUAL TRANSPORT / WORK</text></g>
<g transform="translate(856 150)"><rect width="232" height="306" rx="6" fill="#e6eefb" stroke="#234d9b"/><text x="18" y="30" class="w-role">04 / CLI + REVIEWER / OWNER</text><text x="18" y="72" class="w-head">Verify</text><text x="18" y="106" class="w-text">Validate the result.</text><text x="18" y="134" class="w-text">Recheck live sources.</text><text x="18" y="162" class="w-text">Independent review</text><text x="18" y="190" class="w-text">if required; owner gates.</text><path d="M18 215H214" stroke="#b6c7e2"/><text x="18" y="246" class="w-label">Output: reviewed evidence</text><text x="18" y="277" class="w-role">CLI CHECKS + MANUAL GATES</text></g>
<g transform="translate(1128 150)"><rect width="232" height="306" rx="6" fill="#f0f5f2" stroke="#246448"/><text x="18" y="30" class="w-role">05 / AUTHORIZED CONTROLLER</text><text x="18" y="72" class="w-head">Learn</text><text x="18" y="106" class="w-text">Save factual writeback.</text><text x="18" y="134" class="w-text">Record the next action.</text><text x="18" y="162" class="w-text">Propose knowledge</text><text x="18" y="190" class="w-text">through a separate gate.</text><path d="M18 215H214" stroke="#c1d4c8"/><text x="18" y="246" class="w-label">Output: saved continuation</text><text x="18" y="277" class="w-role">MANUAL / OWNER-GATED</text></g>
<path class="w-solid" d="M272 295H312"/><path class="w-manual" d="M544 295H584"/><path class="w-manual" d="M816 295H856"/><path class="w-manual" d="M1088 295H1128"/>
<text x="545" y="131" class="w-small">Manual handoff</text><text x="832" y="131" class="w-small">Manual return</text>
<path class="w-manual" d="M400 456V512H620V546"/><text x="315" y="497" class="w-small">check refuses</text><path class="w-manual" d="M972 456V512H700V546"/><text x="982" y="498" class="w-small">fails / stale / missing</text>
<g transform="translate(584 546)"><rect width="504" height="106" rx="6" fill="#fff5df" stroke="#9a742d"/><text x="18" y="31" class="w-label">STOP / INSPECT / REVISE — MANUAL</text><text x="18" y="59" class="w-text">Keep old evidence. Reconcile the cause.</text><text x="18" y="86" class="w-text">Build a fresh authorized bundle; do not edit hashes.</text></g>
<path class="w-manual" d="M584 598H428V456"/><text x="319" y="584" class="w-small">rebuild context</text>
<g transform="translate(1128 546)"><rect width="232" height="165" rx="6" fill="#fff5df" stroke="#9a742d"/><text x="16" y="28" class="w-role">SEPARATE OWNER / CLI GATE</text><text x="16" y="58" class="w-label">Knowledge promotion</text><text x="16" y="86" class="w-text">Bronze → pending Silver</text><text x="16" y="112" class="w-text">Exact owner decision</text><text x="16" y="138" class="w-text">+ fresh checks → Gold</text></g>
<path class="w-manual" d="M1244 456V546"/><text x="1256" y="498" class="w-small">if useful</text>
<path class="w-manual" d="M1244 711V756H156V456"/><text x="354" y="743" class="w-small">Next session: read saved project state, result and next action; rerun review against current files.</text>
<text x="40" y="803" class="w-small">A proposed update is not an applied update. CLI success is not independent review, owner approval or release permission.</text>
</svg>
