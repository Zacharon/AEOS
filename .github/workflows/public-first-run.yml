name: Public synthetic first run
on:
  pull_request:
    paths: ['distribution/**', 'tools/**', 'tests/**', 'docs/**', 'site/**', 'README.md', '.github/workflows/public-first-run.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-first-run-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-powershell:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.5'
          architecture: x64
      - name: Fresh environment, ZIP, startup, fresh-shell continuation and synthetic regressions
        run: |
          & ./tools/qualify_public.ps1 -WorkRoot (Join-Path $env:RUNNER_TEMP 'AEOS synthetic qualification')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # No artifact uploads, model/provider credentials, deployment or release.
      # Local definition only: hosted CI has NOT RUN for this candidate.
